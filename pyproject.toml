[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-engine"
version = "0.1.0"
description = "A lightweight, modular Retrieval-Augmented Generation pipeline."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
rag = "src.cli:main"

[tool.setuptools]
packages = ["src", "src.embedder", "src.retriever", "src.llm", "src.pipeline"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
